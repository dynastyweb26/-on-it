<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&amp;display=block"></helmet>
<header style="height:64px;display:flex;align-items:center;padding:0 10px 0 16px;background:#FFF8F0;border-bottom:1px solid #EFE4D3;box-sizing:border-box;font-family:Inter,sans-serif;position:relative;z-index:2">
  <div style="flex:none;white-space:nowrap;font:800 22px/1 Montserrat,sans-serif;color:#1F1B16;letter-spacing:-0.01em">On It<span style="color:#D5AF36">.</span></div>
  <div style="display:flex;gap:2px;margin-left:18px">
    <button aria-label="New chat" style="width:48px;height:48px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;color:#2F2A24;cursor:pointer;transition:transform 140ms cubic-bezier(0.2,0.8,0.2,1),background-color 140ms" style-hover="background:#F6EDDF" style-active="transform:scale(0.92);background:#F1E6D4"><span style="font:24px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 500">edit_square</span></button>
    <button aria-label="History" style="width:48px;height:48px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;color:#2F2A24;cursor:pointer;transition:transform 140ms cubic-bezier(0.2,0.8,0.2,1),background-color 140ms" style-hover="background:#F6EDDF" style-active="transform:scale(0.92);background:#F1E6D4"><span style="font:24px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 500">history</span></button>
  </div>
  <button style="margin-left:auto;flex:none;white-space:nowrap;height:44px;padding:0 18px;border:0;border-radius:999px;background:#D5AF36;color:#1F1B16;font:600 15px/1 Inter,sans-serif;cursor:pointer;transition:transform 140ms cubic-bezier(0.2,0.8,0.2,1),filter 140ms" style-active="transform:scale(0.96)">How On It works</button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:64}}"></script>
</body>
</html>
