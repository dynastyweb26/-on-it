<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=block" rel="stylesheet">
</helmet>
<div style="width:100%">
<sc-if value="{{ visible }}">
<div style="background:#FFFCF7;border:1.5px solid #ECE2D0;border-radius:24px;padding:14px 12px 8px 16px;display:flex;flex-direction:column;gap:12px;font-family:Inter,sans-serif;color:#221D18">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
    <div style="display:flex;flex-direction:column;gap:6px;padding-top:4px">
      <div style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#857B6E">Quick check-in</div>
      <div style="font-family:Montserrat,sans-serif;font-weight:800;font-size:18px;line-height:1.25;text-wrap:pretty">How's On It working for you?</div>
    </div>
    <div role="button" aria-label="Dismiss" onClick="{{ onDismiss }}" style="width:36px;height:36px;border-radius:50%;background:#F1E9DC;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none"><span class="material-symbols-outlined" style="font-size:18px">close</span></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:#EFE7DB;margin-right:4px">
    <sc-for list="{{ choices }}" as="c" hint-placeholder-count="3">
      <div role="button" aria-pressed="{{ c.on }}" onClick="{{ c.onTap }}" style="height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;white-space:nowrap;background:{{ c.bg }};font-weight:{{ c.weight }};color:{{ c.fg }};box-shadow:{{ c.shadow }}">{{ c.label }}</div>
    </sc-for>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;min-height:44px">
    <div style="font-size:14px;color:#5F574D">{{ status }}</div>
    <a href="#help-feedback" style="display:flex;align-items:center;gap:2px;font-size:15px;font-weight:600;color:#7A5E00;text-decoration:none;height:44px;padding-left:8px">Tell us more<span class="material-symbols-outlined" style="font-size:20px">chevron_right</span></a>
  </div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:322,&quot;height&quot;:220},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;open&quot;,&quot;picked&quot;,&quot;dismissed&quot;],&quot;default&quot;:&quot;open&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onDismiss&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { pick: this.props.state === 'picked' ? 'Love it' : null, gone: this.props.state === 'dismissed' };
  componentDidUpdate(pp) { if (pp.state !== this.props.state) this.setState({ pick: this.props.state === 'picked' ? 'Love it' : null, gone: this.props.state === 'dismissed' }); }
  renderVals() {
    const pk = this.state.pick;
    return {
      visible: !this.state.gone,
      choices: ['Not great', "It's okay", 'Love it'].map(l => { const on = pk === l; return { label: l, on, bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#221D18' : '#5F574D', weight: on ? 600 : 500, shadow: on ? '0 1px 3px rgba(50,40,25,.14)' : 'none', onTap: () => this.setState({ pick: l }) }; }),
      status: pk ? 'Got it. Saved.' : 'Takes one tap.',
      onDismiss: () => { this.setState({ gone: true }); this.props.onDismiss?.(); }
    };
  }
}
</script>
</body>
</html>
