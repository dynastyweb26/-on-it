<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=block" rel="stylesheet">
</helmet>
<div style="display:flex;flex-direction:column;gap:6px;align-items:stretch;font-family:Inter,sans-serif;color:#221D18">
  <div style="display:flex;gap:0;margin-left:-10px">
    <div role="button" aria-label="Good response" aria-pressed="{{ upOn }}" onClick="{{ onUp }}" style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#F4ECDF"><span class="material-symbols-outlined" style="font-size:18px;color:{{ upColor }};font-variation-settings:{{ upFill }}">thumb_up</span></div>
    <div role="button" aria-label="Bad response" aria-pressed="{{ downOn }}" onClick="{{ onDown }}" style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#F4ECDF"><span class="material-symbols-outlined" style="font-size:18px;color:{{ downColor }};font-variation-settings:{{ downFill }}">thumb_down</span></div>
  </div>
  <sc-if value="{{ open }}">
    <div style="background:#FFFCF7;border:1.5px solid #ECE2D0;border-radius:20px;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div style="font-size:16px;font-weight:700">What went wrong?</div>
        <div role="button" aria-label="Close" onClick="{{ onClose }}" style="width:36px;height:36px;border-radius:50%;background:#F1E9DC;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none"><span class="material-symbols-outlined" style="font-size:18px;color:#221D18">close</span></div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="6">
          <div role="button" onClick="{{ c.onTap }}" style="display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;border:1.5px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }}"><sc-if value="{{ c.on }}"><span class="material-symbols-outlined" style="font-size:16px">check</span></sc-if>{{ c.label }}</div>
        </sc-for>
      </div>
      <textarea value="{{ note }}" onChange="{{ onNote }}" rows="2" placeholder="Add a note (optional)" style="width:100%;box-sizing:border-box;border:1.5px solid #E8DDCB;border-radius:14px;padding:10px 12px;font-family:Inter,sans-serif;font-size:15px;line-height:1.4;color:#221D18;background:#FFFFFF;resize:none;outline:none"></textarea>
      <sc-if value="{{ isError }}"><div style="display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:#A8432A"><span class="material-symbols-outlined" style="font-size:16px">error</span>Didn't send. Your picks are kept.</div></sc-if>
      <div style="display:flex;gap:10px">
        <div role="button" onClick="{{ onClose }}" style="flex:1;height:44px;border-radius:999px;border:1.5px solid #E2D6C2;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;cursor:pointer">Skip</div>
        <div role="button" onClick="{{ onSend }}" style="flex:1;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;cursor:pointer;background:{{ sendBg }};color:{{ sendFg }}">{{ sendLabel }}</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:322,&quot;height&quot;:380},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;up&quot;,&quot;down&quot;,&quot;open&quot;,&quot;openFilled&quot;,&quot;error&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onVote&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(vote, reasons?, note?)=&gt;void&quot;}}">
class Component extends DCLogic {
  init(s) {
    return { vote: s === 'up' ? 'up' : (s === 'idle' || !s ? null : 'down'), open: s === 'open' || s === 'openFilled' || s === 'error',
      picked: s === 'openFilled' || s === 'error' ? ['Wrong number'] : [], note: s === 'openFilled' || s === 'error' ? 'It used last month, not this one.' : '' };
  }
  state = this.init(this.props.state);
  componentDidUpdate(pp) { if (pp.state !== this.props.state) this.setState(this.init(this.props.state)); }
  renderVals() {
    const { vote, open, picked, note } = this.state, st = this.props.state;
    const labels = ['Wrong number', 'Wrong person or record', "Didn't understand", "Couldn't do it", 'Too slow', 'Other'];
    const can = picked.length > 0 || note.trim().length > 0;
    const fill = on => on ? "'FILL' 1" : "'FILL' 0";
    return {
      upOn: vote === 'up', downOn: vote === 'down',
      upColor: vote === 'up' ? '#322C25' : '#9A9083', downColor: vote === 'down' ? '#322C25' : '#9A9083',
      upFill: fill(vote === 'up'), downFill: fill(vote === 'down'),
      onUp: () => this.setState({ vote: vote === 'up' ? null : 'up', open: false }),
      onDown: () => this.setState(vote === 'down' ? { vote: null, open: false } : { vote: 'down', open: true }),
      open, isError: st === 'error',
      chips: labels.map(l => { const on = picked.includes(l); return { label: l, on, bg: on ? '#322C25' : '#FFFFFF', fg: on ? '#FCF6EE' : '#221D18', border: on ? '#322C25' : '#E2D6C2', onTap: () => this.setState(s => ({ picked: on ? s.picked.filter(x => x !== l) : [...s.picked, l] })) }; }),
      note, onNote: e => this.setState({ note: e.target.value }),
      onClose: () => this.setState({ open: false }),
      onSend: () => { if (can) this.setState({ open: false }); },
      sendLabel: st === 'error' ? 'Try again' : 'Send',
      sendBg: can ? '#D4AF37' : '#F2E6BF', sendFg: can ? '#221D18' : '#8C7A45'
    };
  }
}
</script>
</body>
</html>
