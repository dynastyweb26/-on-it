<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=block" rel="stylesheet">
</helmet>
<div style="background:#FFFDF9;border:1.5px solid #E6DCCB;border-radius:22px;overflow:hidden;font-family:Inter,sans-serif;color:#221D18">
  <sc-if value="{{ isLoading }}">
    <div style="display:flex;align-items:center;gap:14px;padding:14px"><div style="width:40px;height:40px;border-radius:12px;background:#F1E9DC"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px"><div style="height:12px;width:55%;border-radius:6px;background:#F1E9DC"></div><div style="height:10px;width:35%;border-radius:5px;background:#F5EFE5"></div></div></div>
  </sc-if>
  <sc-if value="{{ isEmpty }}">
    <div style="display:flex;align-items:center;gap:14px;padding:14px">
      <div style="width:40px;height:40px;border-radius:12px;background:#F1E9DC;display:flex;align-items:center;justify-content:center;flex:none"><span class="material-symbols-outlined" style="font-size:20px;color:#8C8275">link_off</span></div>
      <div style="min-width:0;display:flex;flex-direction:column;gap:2px"><div style="font-size:16px;font-weight:600;color:#5F574D">{{ emptyTitle }}</div><div style="font-size:13px;color:#6E655A">It was deleted or merged.</div></div>
    </div>
  </sc-if>
  <sc-if value="{{ isError }}">
    <div style="display:flex;align-items:center;gap:14px;padding:10px 10px 10px 14px">
      <div style="width:40px;height:40px;border-radius:12px;background:#F8E3DC;display:flex;align-items:center;justify-content:center;flex:none"><span class="material-symbols-outlined" style="font-size:20px;color:#A8432A">error</span></div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><div style="font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Couldn't open {{ first.title }}</div><div style="font-size:13px;color:#6E655A">Check your connection.</div></div>
      <div role="button" style="height:44px;display:flex;align-items:center;padding:0 10px;font-size:15px;font-weight:600;color:#7A5E00;cursor:pointer;flex:none">Retry</div>
    </div>
  </sc-if>
  <sc-if value="{{ isFilled }}">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="1">
      <div role="button" onClick="{{ it.onOpen }}" style="display:flex;align-items:center;gap:14px;padding:12px 10px 12px 14px;min-height:64px;box-sizing:border-box;cursor:pointer;border-top:{{ it.divider }}" style-hover="background:#FBF5EA" style-active="background:#F5EDDF">
        <div style="width:40px;height:40px;border-radius:12px;background:#F1E9DC;display:flex;align-items:center;justify-content:center;flex:none"><span class="material-symbols-outlined" style="font-size:20px;color:#221D18">{{ it.icon }}</span></div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <div style="font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.title }}</div>
          <div style="font-size:13px;color:#6E655A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.line }}</div>
        </div>
        <span class="material-symbols-outlined" style="font-size:20px;color:#5F574D;flex:none">chevron_right</span>
      </div>
    </sc-for>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:322,&quot;height&quot;:240},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;filled&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;default&quot;:&quot;filled&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{icon,title,line}[] (1–3)&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(item,i)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, st = p.state ?? 'filled';
    const src = p.items ?? [{ icon: 'description', title: 'INV-0069 · Ruth Lawrence', line: 'Paid in full · Closed Nov 11' }];
    const items = src.map((it, i) => ({ ...it, divider: i ? '1px solid #EFE6D8' : 'none', onOpen: () => p.onOpen?.(it, i) }));
    return {
      items, first: items[0] ?? {},
      emptyTitle: p.emptyTitle ?? 'INV-0069 is gone',
      isLoading: st === 'loading', isEmpty: st === 'empty', isError: st === 'error', isFilled: st === 'filled'
    };
  }
}
</script>
</body>
</html>
