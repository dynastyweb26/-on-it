<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet">
<style>
@keyframes oiSpin{to{transform:rotate(360deg)}}
@keyframes oiIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes oiFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){[data-m]{animation-name:oiFade !important;animation-iteration-count:1 !important}}
</style>
</helmet>
<div data-component="PopInline" style="width:390px;box-sizing:border-box;border-radius:36px;background:#fdf8f1;box-shadow:0 0 0 8px #1e1a15, 0 30px 60px -24px rgba(40,30,10,.4);padding:20px 16px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-family:Inter,system-ui,sans-serif;color:#1e1a15;-webkit-font-smoothing:antialiased;flex:none;">
  <sc-if value="{{ hasUser }}" hint-placeholder-val="{{ true }}">
    <div style="align-self:flex-end;max-width:78%;padding:12px 16px;background:#34302a;color:#fdf8f1;border-radius:20px;font-size:15px;line-height:1.4;">{{ user }}</div>
  </sc-if>

  <div role="{{ role }}" aria-busy="{{ pending }}" style="width:{{ cW }};max-width:{{ cMax }};box-sizing:border-box;background:{{ cBg }};border:1px solid {{ cBd }};border-radius:{{ cR }};padding:{{ cPad }};display:flex;flex-direction:column;gap:12px;">
    <sc-if value="{{ hasEyebrow }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-family:'Material Symbols Outlined';line-height:1;font-size:20px;color:#735c00;">{{ eyebrowIcon }}</span>
        <span style="font-family:Montserrat,sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px;color:#735c00;">{{ eyebrow }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ hasSummary }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid #f1e9db;">
        <sc-for list="{{ summary }}" as="m" hint-placeholder-count="2">
          <div style="display:flex;justify-content:space-between;gap:12px;font-size:{{ m.fs }};font-weight:{{ m.fw }};font-family:{{ m.ff }};"><span>{{ m.k }}</span><span>{{ m.v }}</span></div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ hasHead }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;gap:12px;align-items:flex-start;">
        <sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><div style="width:36px;height:36px;border-radius:11px;background:#f2e5b9;display:flex;align-items:center;justify-content:center;flex:none;"><span style="font-family:'Material Symbols Outlined';line-height:1;font-size:20px;">{{ icon }}</span></div></sc-if>
        <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
          <sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ false }}"><div style="font-size:{{ titleFs }};font-weight:{{ titleFw }};font-family:{{ titleFf }};line-height:1.25;text-wrap:pretty;">{{ title }}</div></sc-if>
          <sc-if value="{{ hasText }}" hint-placeholder-val="{{ true }}"><div style="font-size:{{ textFs }};line-height:1.45;color:{{ textFg }};text-wrap:pretty;">{{ text }}</div></sc-if>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ false }}">
      <div style="background:#ffffff;border:1px solid #ebe2d2;border-radius:16px;overflow:hidden;">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="2">
          <div style="display:flex;align-items:baseline;gap:12px;padding:11px 14px;border-bottom:{{ r.border }};">
            <span style="width:68px;flex:none;font-size:13px;color:#5f574b;">{{ r.k }}</span>
            <span style="flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;">
              <sc-if value="{{ r.hasFrom }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;color:#8f8676;text-decoration:line-through;">{{ r.from }}</span><span style="font-family:'Material Symbols Outlined';line-height:1;font-size:15px;color:#8f8676;">arrow_forward</span></sc-if>
              <span style="font-size:15px;font-weight:600;">{{ r.to }}</span>
            </span>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ hasChoices }}" hint-placeholder-val="{{ false }}">
      <div style="background:#ffffff;border:1px solid #ebe2d2;border-radius:16px;overflow:hidden;">
        <sc-for list="{{ choices }}" as="c" hint-placeholder-count="2">
          <button onClick="{{ c.tap }}" disabled="{{ pending }}" style="width:100%;min-height:58px;display:flex;align-items:center;gap:12px;padding:10px 14px;border:none;border-bottom:{{ c.border }};background:transparent;text-align:left;font-family:inherit;color:{{ c.fg }};cursor:pointer;" style-active="background:#faf3e7">
            <span style="font-family:'Material Symbols Outlined';line-height:1;font-size:20px;color:#5f574b;">{{ c.icon }}</span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;"><span style="font-size:16px;font-weight:600;">{{ c.label }}</span><sc-if value="{{ c.hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:#5f574b;">{{ c.sub }}</span></sc-if></span>
            <sc-if value="{{ c.spin }}" hint-placeholder-val="{{ false }}"><span data-m="" style="width:16px;height:16px;border-radius:50%;border:2px solid #8f8676;border-top-color:transparent;box-sizing:border-box;animation:oiSpin 800ms linear infinite;"></span></sc-if>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ showAlert }}" hint-placeholder-val="{{ false }}">
      <div data-m="" role="alert" style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:{{ alertBg }};border:1px solid #eedfb5;animation:oiIn 200ms cubic-bezier(.2,.8,.2,1) both;">
        <span style="font-family:'Material Symbols Outlined';line-height:1;font-size:20px;color:#c8412e;">{{ errIcon }}</span>
        <div style="display:flex;flex-direction:column;gap:2px;"><sc-if value="{{ hasErrTitle }}" hint-placeholder-val="{{ false }}"><div style="font-size:15px;font-weight:600;">{{ errTitle }}</div></sc-if><div style="font-size:14px;line-height:1.45;color:#3a352d;">{{ errBody }}</div></div>
      </div>
    </sc-if>
    <sc-if value="{{ hasActions }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:{{ actDir }};flex-wrap:wrap;gap:8px;">
        <sc-for list="{{ actions }}" as="a" hint-placeholder-count="1">
          <button onClick="{{ a.tap }}" disabled="{{ a.disabled }}" aria-busy="{{ a.spin }}" style="height:{{ a.h }};border-radius:24px;border:{{ a.bd }};background:{{ a.bg }};color:{{ a.fg }};font-family:{{ a.ff }};font-weight:700;font-size:15px;cursor:{{ a.cursor }};display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;transition:background 200ms cubic-bezier(.2,.8,.2,1), transform 120ms cubic-bezier(.2,.8,.2,1);" style-active="transform:scale(.97)">
            <sc-if value="{{ a.spin }}" hint-placeholder-val="{{ false }}"><span data-m="" style="width:16px;height:16px;border-radius:50%;border:2px solid #8f8676;border-top-color:transparent;box-sizing:border-box;animation:oiSpin 800ms linear infinite;"></span></sc-if>
            <sc-if value="{{ a.hasIcon }}" hint-placeholder-val="{{ false }}"><span style="font-family:'Material Symbols Outlined';line-height:1;font-size:18px;">{{ a.icon }}</span></sc-if>
            <span>{{ a.label }}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ hasCaption }}" hint-placeholder-val="{{ false }}"><div style="font-size:13px;line-height:1.45;color:#5f574b;text-align:center;">{{ caption }}</div></sc-if>
  </div>

  <sc-if value="{{ hasChips }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-wrap:wrap;gap:8px;">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="1"><button style="height:44px;padding:0 16px;border-radius:22px;border:1px solid #e3d8c5;background:#ffffff;font-family:Inter,sans-serif;font-size:14px;font-weight:600;color:#1e1a15;cursor:pointer;display:flex;align-items:center;gap:6px;"><span style="font-family:'Material Symbols Outlined';line-height:1;font-size:17px;color:#735c00;">north_east</span>{{ c }}</button></sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ hasThumbs }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;gap:2px;margin:-4px 0 0 -6px;">
      <button onClick="{{ tapUp }}" aria-pressed="{{ upOn }}" aria-label="Good answer" style="width:44px;height:44px;border-radius:22px;border:none;background:{{ upBg }};color:{{ upFg }};display:flex;align-items:center;justify-content:center;cursor:pointer;"><span style="font-family:'Material Symbols Outlined';line-height:1;font-size:19px;">thumb_up</span></button>
      <button onClick="{{ tapDown }}" aria-pressed="{{ downOn }}" aria-label="Bad answer" style="width:44px;height:44px;border-radius:22px;border:none;background:{{ downBg }};color:{{ downFg }};display:flex;align-items:center;justify-content:center;cursor:pointer;"><span style="font-family:'Material Symbols Outlined';line-height:1;font-size:19px;">thumb_down</span></button>
    </div>
  </sc-if>
  <sc-if value="{{ showDone }}" hint-placeholder-val="{{ false }}">
    <div data-m="" style="display:flex;flex-direction:column;gap:10px;align-items:flex-start;animation:oiIn 220ms cubic-bezier(.2,.8,.2,1) both;">
      <div style="max-width:85%;padding:12px 16px;background:#f0e8db;border:1px solid #e3d8c5;border-radius:20px;font-size:15px;line-height:1.4;">{{ doneText }}</div>
      <button onClick="{{ replay }}" style="height:44px;padding:0 16px;border-radius:22px;border:1.5px solid #e3d8c5;background:#ffffff;font-family:Inter,sans-serif;font-weight:600;font-size:14px;color:#1e1a15;cursor:pointer;display:flex;align-items:center;gap:6px;"><span style="font-family:'Material Symbols Outlined';line-height:1;font-size:18px;">replay</span>Replay</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:410,&quot;height&quot;:520},&quot;spec&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;kind&quot;:&quot;card&quot;,&quot;user&quot;:&quot;actually it's for Mike Davis, deck stain x3&quot;,&quot;eyebrow&quot;:&quot;THIS WOULD CHANGE INV-0007&quot;,&quot;eyebrowIcon&quot;:&quot;edit_document&quot;,&quot;text&quot;:&quot;This would change INV-0007. Update it, or start a new invoice?&quot;,&quot;rows&quot;:[{&quot;k&quot;:&quot;Client&quot;,&quot;from&quot;:&quot;Brandon&quot;,&quot;to&quot;:&quot;Mike Davis&quot;},{&quot;k&quot;:&quot;Total&quot;,&quot;from&quot;:&quot;$200.00&quot;,&quot;to&quot;:&quot;$450.00&quot;}],&quot;actions&quot;:[{&quot;label&quot;:&quot;Update INV-0007&quot;,&quot;kind&quot;:&quot;gold&quot;,&quot;go&quot;:true,&quot;busyLabel&quot;:&quot;Updating…&quot;},{&quot;label&quot;:&quot;Start a new invoice&quot;,&quot;kind&quot;:&quot;outline&quot;}],&quot;error&quot;:{&quot;icon&quot;:&quot;cloud_off&quot;,&quot;title&quot;:&quot;You're offline&quot;,&quot;body&quot;:&quot;INV-0007 wasn't changed.&quot;},&quot;retryLabel&quot;:&quot;Try again&quot;,&quot;doneText&quot;:&quot;Updated INV-0007.&quot;},&quot;tsType&quot;:&quot;object&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;pending&quot;,&quot;error&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const FF_M='Montserrat,sans-serif',FF_I='Inter,sans-serif';
const BTN={
  gold:{bg:'#d4af37',fg:'#1e1a15',bd:'none',h:'48px',ff:FF_M},
  danger:{bg:'#ffffff',fg:'#c8412e',bd:'1.5px solid #e3d8c5',h:'48px',ff:FF_M},
  outline:{bg:'#ffffff',fg:'#1e1a15',bd:'1.5px solid #e3d8c5',h:'48px',ff:FF_I},
  dark:{bg:'#34302a',fg:'#fdf8f1',bd:'none',h:'48px',ff:FF_M},
  text:{bg:'transparent',fg:'#3a352d',bd:'none',h:'44px',ff:FF_I}
};
const KIND={
  bubble:{bg:'#f0e8db',bd:'#e3d8c5',r:'20px',max:'85%',w:'auto',pad:'12px 16px'},
  card:{bg:'#faf3e7',bd:'#eedfb5',r:'24px',max:'100%',w:'100%',pad:'16px'},
  error:{bg:'#faf3e7',bd:'#eedfb5',r:'20px',max:'90%',w:'auto',pad:'14px 16px'},
  slot:{bg:'#ffffff',bd:'#ebe2d2',r:'24px',max:'100%',w:'100%',pad:'16px'}
};
class Component extends DCLogic{
  constructor(p){super(p);this.busy=false;this.state=this.init(p);}
  init(p){const st=p.state||'idle';return{st,attempt:st==='error'?1:0,vote:(p.spec||{}).vote||null};}
  componentDidUpdate(pp){if(pp.state!==this.props.state||pp.spec!==this.props.spec){clearTimeout(this.t);this.busy=false;this.setState(this.init(this.props));}}
  componentWillUnmount(){clearTimeout(this.t);}
  go(){
    const s=this.props.spec||{};
    if(this.busy||this.state.st==='pending'||this.state.st==='done')return;
    this.busy=true;this.setState({st:'pending'});
    this.t=setTimeout(()=>{this.busy=false;const fail=s.error&&this.state.attempt===0;this.setState({st:fail?'error':'done',attempt:this.state.attempt+1});},1400);
  }
  renderVals(){
    const s=this.props.spec||{},st=this.state.st,kind=s.kind||'card',K=KIND[kind];
    const pending=st==='pending',done=st==='done';
    const err=s.error||{},alert=st==='error'?err:s.alert;
    const rows=s.rows||[],ch=s.choices||[];
    const isCard=kind==='card'||kind==='slot';
    const v=this.state.vote;
    return{
      hasUser:!!s.user,user:s.user,
      role:st==='error'||s.alert?'alert':'group',pending,
      cBg:K.bg,cBd:K.bd,cR:K.r,cMax:K.max,cW:K.w,cPad:K.pad,
      hasEyebrow:!!s.eyebrow,eyebrow:s.eyebrow,eyebrowIcon:s.eyebrowIcon||'description',
      hasSummary:!!(s.summary&&s.summary.length),
      summary:(s.summary||[]).map(m=>({...m,fs:m.big?'20px':'14px',fw:m.big?800:500,ff:m.big?FF_M:FF_I})),
      hasHead:!!(s.title||s.text),hasIcon:!!s.icon,icon:s.icon,
      hasTitle:!!s.title,title:s.title,
      titleFs:isCard?'19px':'16px',titleFw:isCard?800:600,titleFf:isCard?FF_M:FF_I,
      hasText:!!s.text,text:s.text,textFs:kind==='bubble'?'16px':'15px',textFg:kind==='bubble'?'#1e1a15':'#3a352d',
      hasRows:rows.length>0,rows:rows.map((r,i)=>({...r,hasFrom:!!r.from,border:i<rows.length-1?'1px solid #f1e9db':'none'})),
      hasChoices:ch.length>0,
      choices:ch.map((c,i)=>({...c,icon:c.icon||'person',hasSub:!!c.sub,border:i<ch.length-1?'1px solid #f1e9db':'none',fg:pending?'#8f8676':'#1e1a15',spin:pending&&i===0,tap:()=>this.go()})),
      showAlert:!!alert&&!done,alertBg:kind==='slot'?'#faf3e7':'#ffffff',
      errIcon:alert&&alert.icon||'error',hasErrTitle:!!(alert&&alert.title),errTitle:alert&&alert.title,errBody:alert&&alert.body,
      hasActions:!!(s.actions&&s.actions.length)&&!done,actDir:s.row?'row':'column',
      actions:(s.actions||[]).map(a=>{
        const spin=pending&&a.go,dis=pending||a.disabled;
        const base=BTN[a.kind||'outline'];
        const look=spin?{...base,bg:'#efe7da',fg:'#3a352d',bd:'none'}:dis?{...base,bg:a.kind==='text'?'transparent':'#efe7da',fg:'#8f8676',bd:'none'}:base;
        return{...look,label:spin?(a.busyLabel||'Working…'):(st==='error'&&a.go&&s.retryLabel)?s.retryLabel:a.label,
          spin,disabled:dis,cursor:dis?'default':'pointer',hasIcon:!!a.icon&&!spin,icon:a.icon,tap:()=>{if(a.go)this.go();}};
      }),
      hasCaption:!!s.caption&&!done,caption:s.caption,
      hasChips:!!(s.chips&&s.chips.length),chips:s.chips||[],
      hasThumbs:!!s.thumbs,
      upOn:v==='up',downOn:v==='down',
      upBg:v==='up'?'#f2e5b9':'transparent',upFg:v==='up'?'#1e1a15':'#8f8676',
      downBg:v==='down'?'#f2e5b9':'transparent',downFg:v==='down'?'#1e1a15':'#8f8676',
      tapUp:()=>this.setState({vote:v==='up'?null:'up'}),tapDown:()=>this.setState({vote:v==='down'?null:'down'}),
      showDone:done,doneText:s.doneText||'Done.',
      replay:()=>{clearTimeout(this.t);this.busy=false;this.setState({st:'idle',attempt:0});}
    };
  }
}
</script>
</body>
</html>
